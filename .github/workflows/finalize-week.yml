name: Finalize the week

# Settles any finished games, finalizes the active week (pending legs stay
# pending for the commissioner) and opens the next one. This is the manual
# backup: the Tuesday-morning Claude routine runs it on schedule (see
# docs/claude-grader.md), because GitHub delayed or dropped scheduled runs.
on:
  workflow_dispatch:

permissions: {}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Finalize and open the next week
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://off-league-megalay.abhinavsehgal55.workers.dev' }}
          TOKEN: ${{ secrets.PORTAL_RESULTS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PORTAL_RESULTS_TOKEN is not set for this repository; nothing to do."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 90 -X POST "$PORTAL_URL/api/finalize" -H "Authorization: Bearer $TOKEN"
