name: Check final scores

# Asks the portal to settle finished games from final scores. This is the
# manual backup: the scheduled checks run from the Claude routines (see
# docs/claude-grader.md), because GitHub delayed or dropped many scheduled runs.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Settle finished games
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://off-league-megalay.abhinavsehgal55.workers.dev' }}
          TOKEN: ${{ secrets.PORTAL_RESULTS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PORTAL_RESULTS_TOKEN is not set for this repository; nothing to do."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 60 -X POST "$PORTAL_URL/api/results" -H "Authorization: Bearer $TOKEN"
