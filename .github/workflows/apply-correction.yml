name: Apply a data correction

# Applies one reviewed SQL file from corrections/ to the live database.
# Records a Time Travel restore point first so the change can be rolled back
# with `wrangler d1 time-travel restore off-league-megalay --bookmark=<id>`.
on:
  workflow_dispatch:
    inputs:
      file:
        description: Correction file (under corrections/)
        required: true
      confirm:
        description: Type APPLY to change the live database
        required: true

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: off-league-megalay
      FILE: ${{ inputs.file }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the request
        run: |
          case "$FILE" in corrections/*.sql) ;; *) echo "::error::Only .sql files under corrections/ can be applied."; exit 1;; esac
          case "$FILE" in *..*) echo "::error::Invalid path."; exit 1;; esac
          test -f "$FILE" || { echo "::error::$FILE does not exist on this branch."; exit 1; }
          [ "$CONFIRM" = "APPLY" ] || { echo "::error::Type APPLY to confirm."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record a restore point
        run: npx wrangler d1 time-travel info "$D1_NAME"
      - name: Apply the correction
        run: npx wrangler d1 execute "$D1_NAME" --remote --yes --file "$FILE"
