name: Import portal records to Cloudflare

# One-time move: copies every record from the old portal's public board into
# the new, empty Cloudflare database, then checks the new portal matches the
# old one field by field. Refuses to run if the new database already has picks.
on:
  workflow_dispatch:
    inputs:
      old_url:
        description: Old portal URL
        default: https://off-league-parlay-portal.abhinavsehgal55.chatgpt.site
        required: true
      new_url:
        description: New portal URL (the workers.dev address from the deploy log)
        required: true

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: off-league-megalay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse to import over existing picks
        run: |
          n=$(npx wrangler d1 execute "$D1_NAME" --remote --json --command "SELECT COUNT(*) AS n FROM submissions" | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8"))[0].results[0].n))')
          echo "Picks already in the new database: $n"
          test "$n" = "0"
      - name: Copy records from the old portal
        env:
          OLD_URL: ${{ inputs.old_url }}
        run: |
          node scripts/board-to-sql.mjs "$OLD_URL" > "$RUNNER_TEMP/import.sql"
          npx wrangler d1 execute "$D1_NAME" --remote --yes --file "$RUNNER_TEMP/import.sql"
          rm -f "$RUNNER_TEMP/import.sql"
      - name: Check the new portal matches the old one
        env:
          OLD_URL: ${{ inputs.old_url }}
          NEW_URL: ${{ inputs.new_url }}
        run: node scripts/compare-boards.mjs "$OLD_URL" "$NEW_URL"
